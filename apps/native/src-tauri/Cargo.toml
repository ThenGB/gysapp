[package]
name = "gysapp"
version = "0.1.0"
description = "GYSApp — Kidung Rohani, Alkitab, dan bacaan Gereja Yesus Sejati"
authors = ["Gilbert (ThenGB)"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gysapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
