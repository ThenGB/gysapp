name: Fix PDF Loading Task Type

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix stale PDF loading task cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/features/hymnal/song-viewer.tsx')
          text = path.read_text()
          old = 'void loadedDoc.destroy().catch(() => undefined);'
          new = 'void loadingTask.destroy().catch(() => undefined);'
          if old not in text:
              raise SystemExit('Expected stale PDF cleanup expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/web/src/features/hymnal/song-viewer.tsx
          pnpm --filter @gysapp/web typecheck
      - name: Commit type-safe PDF cancellation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/hymnal/song-viewer.tsx
          git commit -m "fix: cancel stale PDF loading task with supported API"
          git push origin HEAD:feature/bible-mobile-parity
