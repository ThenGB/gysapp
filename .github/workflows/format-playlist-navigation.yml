name: Format Playlist Navigation

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/web/src/data/hymnal/hymnal-catalog.ts
          apps/web/src/features/hymnal/midi-player.test.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/data/hymnal/hymnal-catalog.ts \
            apps/web/src/features/hymnal/midi-player.test.tsx
          git commit -m "style: format playlist navigation files"
          git push origin HEAD:feature/bible-mobile-parity
