name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fixture integrity (chord fixtures harus sinkron dengan gyschordweb)
        run: pnpm --filter @gysapp/core test:contract

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Initial JS gzip budget
        run: node scripts/check-web-bundle-budget.mjs

      - name: Format check
        run: pnpm format:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Production E2E + Web Vitals smoke
        run: pnpm exec playwright test --config=playwright.production.config.ts --project=chromium

      - name: Secret scan (basic)
        run: |
          if grep -rniE "rjnsfeygekniyfil|56983466|hatiku\.app@gmail\.com|(password|passwd|pwd)[[:alnum:]_]*[[:space:]]*[:=][[:space:]]*['\"][^'\"[:space:]]{8,}['\"]" \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.github \
            --exclude=pnpm-lock.yaml --exclude-dir=docs .; then
            echo "Potential secret found"; exit 1
          fi
          echo "Secret scan clean"
