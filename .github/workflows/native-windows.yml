name: native-windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/native/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/native-windows.yml'
  push:
    branches: [main]
    paths:
      - 'apps/native/**'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/native-windows.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - name: Build frontend
        run: pnpm --filter @gysapp/web build

      - name: Cargo check
        run: cargo check --manifest-path apps/native/src-tauri/Cargo.toml

      - name: Tauri build (no bundle)
        run: pnpm --filter @gysapp/native build

      - name: Stage Windows soak binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'apps/native/src-tauri/target/release/gysapp.exe'
          if (-not (Test-Path $source)) {
            throw "Expected Windows binary not found at $source"
          }
          New-Item -ItemType Directory -Force -Path 'dist/windows-ci' | Out-Null
          Copy-Item $source 'dist/windows-ci/GYSApp-windows-x64-portable.exe'
          $hash = (Get-FileHash 'dist/windows-ci/GYSApp-windows-x64-portable.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  GYSApp-windows-x64-portable.exe" | Set-Content -NoNewline 'dist/windows-ci/SHA256SUMS.txt'
          '${{ github.event.pull_request.head.sha || github.sha }}' | Set-Content -NoNewline 'dist/windows-ci/SOURCE_SHA.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: gysapp-windows-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/windows-ci/*
          if-no-files-found: error
          retention-days: 14
