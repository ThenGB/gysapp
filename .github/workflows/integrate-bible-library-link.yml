name: Integrate Bible Library Link

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate Settings to Bible library deep-link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('apps/web/src/features/settings/settings-page.tsx')
          text = settings.read_text()
          if "from 'react-router-dom'" not in text:
              text = text.replace(
                  "import { useCallback, useState, useSyncExternalStore } from 'react';\n",
                  "import { useCallback, useState, useSyncExternalStore } from 'react';\nimport { Link } from 'react-router-dom';\n",
                  1,
              )
          phosphor_anchor = "  Check,\n"
          if "  Books,\n" not in text:
              text = text.replace(phosphor_anchor, "  Books,\n" + phosphor_anchor, 1)
          data_actions = '''        <div className="settings-data-actions">
          <button type="button" className="btn-primary" onClick={() => setDialog('export')}>'''
          replacement = '''        <div className="settings-data-actions">
          <Link className="btn-text" to="/bible?library=1">
            <Books size={20} aria-hidden="true" /> Kelola versi Alkitab
          </Link>
          <button type="button" className="btn-primary" onClick={() => setDialog('export')}>'''
          if 'to="/bible?library=1"' not in text:
              if data_actions not in text:
                  raise SystemExit('Settings Data actions anchor not found')
              text = text.replace(data_actions, replacement, 1)
          settings.write_text(text)

          bible = Path('apps/web/src/features/bible/bible-page.tsx')
          text = bible.read_text()
          old_search = '  const [searchParams] = useSearchParams();'
          new_search = '  const [searchParams, setSearchParams] = useSearchParams();'
          if old_search in text:
              text = text.replace(old_search, new_search, 1)
          elif new_search not in text:
              raise SystemExit('Bible useSearchParams anchor not found')
          old_library = '  const [libraryOpen, setLibraryOpen] = useState(false);'
          new_library = "  const libraryRequested = searchParams.get('library') === '1';\n  const [libraryOpen, setLibraryOpen] = useState(libraryRequested);"
          if old_library in text:
              text = text.replace(old_library, new_library, 1)
          elif 'const libraryRequested' not in text:
              raise SystemExit('Bible library state anchor not found')
          tts_effect = '  useEffect(() => () => bibleTts.stop(), []);\n'
          sync_effect = '''  useEffect(() => {
            if (libraryRequested) setLibraryOpen(true);
          }, [libraryRequested]);

          const closeLibrary = () => {
            setLibraryOpen(false);
            if (!libraryRequested) return;
            const next = new URLSearchParams(searchParams);
            next.delete('library');
            setSearchParams(next, { replace: true });
          };

          '''
          sync_effect = '\n'.join(line[10:] if line.startswith('          ') else line for line in sync_effect.splitlines()) + '\n'
          if 'const closeLibrary = () =>' not in text:
              if tts_effect not in text:
                  raise SystemExit('Bible TTS effect anchor not found')
              text = text.replace(tts_effect, tts_effect + '\n' + sync_effect, 1)
          text = text.replace(
              '{libraryOpen && <BibleLibraryDialog onClose={() => setLibraryOpen(false)} />}',
              '{libraryOpen && <BibleLibraryDialog onClose={closeLibrary} />}',
              1,
          )
          bible.write_text(text)

          settings_test = Path('apps/web/src/features/settings/settings-page.test.tsx')
          text = settings_test.read_text()
          if "MemoryRouter" not in text:
              text = text.replace(
                  "import { describe, expect, it, beforeEach } from 'vitest';\n",
                  "import { describe, expect, it, beforeEach } from 'vitest';\nimport { MemoryRouter } from 'react-router-dom';\n",
                  1,
              )
          if 'function renderSettings()' not in text:
              anchor = "import { SettingsPage } from './settings-page';\n"
              helper = "\nfunction renderSettings() {\n  return render(\n    <MemoryRouter>\n      <SettingsPage />\n    </MemoryRouter>,\n  );\n}\n"
              text = text.replace(anchor, anchor + helper, 1)
              text = text.replace('render(<SettingsPage />);', 'renderSettings();')
          if "Kelola versi Alkitab" not in text:
              target = "    expect(screen.getByRole('button', { name: /Ekspor backup/ })).toBeInTheDocument();\n"
              addition = target + "    expect(screen.getByRole('link', { name: /Kelola versi Alkitab/ })).toHaveAttribute(\n      'href',\n      '/bible?library=1',\n    );\n"
              if target not in text:
                  raise SystemExit('Settings test data assertion anchor not found')
              text = text.replace(target, addition, 1)
          settings_test.write_text(text)

          bible_test = Path('apps/web/src/features/bible/bible.test.tsx')
          text = bible_test.read_text()
          if 'opens the Bible library from the Settings deep-link' not in text:
              insert_at = text.index("\n});\n\ndescribe('BibleSearchPage")
              test = '''

            it('opens the Bible library from the Settings deep-link', async () => {
              renderBible(
                '/bible?library=1',
                <Routes>
                  <Route path="/bible" element={<BiblePage />} />
                  <Route path="/bible/:book/:chapter" element={<BiblePage />} />
                </Routes>,
              );

              expect(await screen.findByRole('dialog', { name: 'Kelola Alkitab' })).toBeInTheDocument();
              expect(screen.getByRole('heading', { name: 'Versi Alkitab' })).toBeInTheDocument();
            });
          '''
              test = '\n'.join(line[10:] if line.startswith('          ') else line for line in test.splitlines())
              text = text[:insert_at] + test + text[insert_at:]
          bible_test.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/settings-page.test.tsx apps/web/src/features/bible/bible-page.tsx apps/web/src/features/bible/bible.test.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/settings/settings-page.test.tsx src/features/bible/bible.test.tsx
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/settings-page.test.tsx apps/web/src/features/bible/bible-page.tsx apps/web/src/features/bible/bible.test.tsx
          git commit -m "feat: link Settings to Bible version manager"
          git push origin HEAD:feature/bible-mobile-parity
