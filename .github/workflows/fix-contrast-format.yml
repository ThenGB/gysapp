name: Fix Contrast And Format

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix light accent contrast and format E2E
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/ui/tokens.css')
          text = path.read_text()
          old = '  --accent-contrast: #ffffff;'
          if old not in text:
              raise SystemExit('light accent contrast anchor not found')
          path.write_text(text.replace(old, '  --accent-contrast: #10151f;', 1))
          PY
          pnpm exec prettier --write tests/e2e/accessibility-regression.spec.ts apps/web/src/ui/tokens.css
          pnpm format:check
          pnpm typecheck
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/accessibility-regression.spec.ts apps/web/src/ui/tokens.css
          git commit -m "fix: enforce AA contrast for light accent surfaces"
          git push origin HEAD:feature/bible-mobile-parity
