name: Format PR4 Hymnal

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed milestone files
        run: >-
          pnpm exec prettier --write
          apps/web/src/features/account/account-page.test.tsx
          apps/web/src/features/account/account-page.tsx
          apps/web/src/features/hymnal/hymnal-player-store.ts
          apps/web/src/features/hymnal/midi-player.tsx
          apps/web/src/features/hymnal/playlist-bar.test.tsx
          apps/web/src/features/hymnal/playlist-bar.tsx
          docs/parity-matrix.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/account/account-page.test.tsx \
            apps/web/src/features/account/account-page.tsx \
            apps/web/src/features/hymnal/hymnal-player-store.ts \
            apps/web/src/features/hymnal/midi-player.tsx \
            apps/web/src/features/hymnal/playlist-bar.test.tsx \
            apps/web/src/features/hymnal/playlist-bar.tsx \
            docs/parity-matrix.md
          git commit -m "style: format hymnal and e-GYS milestone"
          git push origin HEAD:feature/bible-mobile-parity
