name: Integrate Bible Library Link V3

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate Settings to Bible library deep-link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('apps/web/src/features/settings/settings-page.tsx')
          text = settings.read_text()
          react_import = "import { useCallback, useState, useSyncExternalStore } from 'react';\n"
          if "import { Link } from 'react-router-dom';" not in text:
              if react_import not in text:
                  raise SystemExit('Settings React import anchor not found')
              text = text.replace(react_import, react_import + "import { Link } from 'react-router-dom';\n", 1)
          if "  Books,\n" not in text:
              icon_at = text.index("import {\n") + len("import {\n")
              text = text[:icon_at] + "  Books,\n" + text[icon_at:]
          if 'to="/bible?library=1"' not in text:
              data_section = text.index('<section className="settings-section" aria-label="Data">')
              actions_marker = '<div className="settings-data-actions">'
              actions_at = text.index(actions_marker, data_section) + len(actions_marker)
              link = "\n          <Link className=\"btn-text\" to=\"/bible?library=1\">\n            <Books size={20} aria-hidden=\"true\" /> Kelola versi Alkitab\n          </Link>"
              text = text[:actions_at] + link + text[actions_at:]
          settings.write_text(text)

          bible = Path('apps/web/src/features/bible/bible-page.tsx')
          text = bible.read_text()
          if 'const [searchParams, setSearchParams] = useSearchParams();' not in text:
              text = text.replace('  const [searchParams] = useSearchParams();', '  const [searchParams, setSearchParams] = useSearchParams();', 1)
          if 'const libraryRequested' not in text:
              text = text.replace('  const [libraryOpen, setLibraryOpen] = useState(false);', "  const libraryRequested = searchParams.get('library') === '1';\n  const [libraryOpen, setLibraryOpen] = useState(libraryRequested);", 1)
          if 'const closeLibrary = () =>' not in text:
              anchor = '  useEffect(() => () => bibleTts.stop(), []);\n'
              if anchor not in text:
                  raise SystemExit('Bible TTS effect anchor not found')
              addition = "\n  useEffect(() => {\n    if (libraryRequested) setLibraryOpen(true);\n  }, [libraryRequested]);\n\n  const closeLibrary = () => {\n    setLibraryOpen(false);\n    if (!libraryRequested) return;\n    const next = new URLSearchParams(searchParams);\n    next.delete('library');\n    setSearchParams(next, { replace: true });\n  };\n"
              text = text.replace(anchor, anchor + addition, 1)
          old_dialog = '{libraryOpen && <BibleLibraryDialog onClose={() => setLibraryOpen(false)} />}'
          if old_dialog in text:
              text = text.replace(old_dialog, '{libraryOpen && <BibleLibraryDialog onClose={closeLibrary} />}', 1)
          elif 'onClose={closeLibrary}' not in text:
              raise SystemExit('Bible library dialog anchor not found')
          bible.write_text(text)

          settings_test = Path('apps/web/src/features/settings/settings-page.test.tsx')
          text = settings_test.read_text()
          if "import { MemoryRouter } from 'react-router-dom';" not in text:
              vitest_line = "import { describe, expect, it, beforeEach } from 'vitest';\n"
              text = text.replace(vitest_line, vitest_line + "import { MemoryRouter } from 'react-router-dom';\n", 1)
          if 'function renderSettings()' not in text:
              anchor = "import { SettingsPage } from './settings-page';\n"
              helper = "\nfunction renderSettings() {\n  return render(\n    <MemoryRouter>\n      <SettingsPage />\n    </MemoryRouter>,\n  );\n}\n"
              text = text.replace(anchor, anchor + helper, 1)
              text = text.replace('render(<SettingsPage />);', 'renderSettings();')
          if "name: /Kelola versi Alkitab/" not in text:
              target = "    expect(screen.getByRole('button', { name: /Ekspor backup/ })).toBeInTheDocument();\n"
              if target not in text:
                  raise SystemExit('Settings test assertion anchor not found')
              addition = target + "    expect(screen.getByRole('link', { name: /Kelola versi Alkitab/ })).toHaveAttribute(\n      'href',\n      '/bible?library=1',\n    );\n"
              text = text.replace(target, addition, 1)
          settings_test.write_text(text)

          bible_test = Path('apps/web/src/features/bible/bible.test.tsx')
          text = bible_test.read_text()
          if 'opens the Bible library from the Settings deep-link' not in text:
              insert_at = text.index("\n});\n\ndescribe('BibleSearchPage")
              test = "\n\n  it('opens the Bible library from the Settings deep-link', async () => {\n    renderBible(\n      '/bible?library=1',\n      <Routes>\n        <Route path=\"/bible\" element={<BiblePage />} />\n        <Route path=\"/bible/:book/:chapter\" element={<BiblePage />} />\n      </Routes>,\n    );\n\n    expect(await screen.findByRole('dialog', { name: 'Kelola Alkitab' })).toBeInTheDocument();\n    expect(screen.getByRole('heading', { name: 'Versi Alkitab' })).toBeInTheDocument();\n  });\n"
              text = text[:insert_at] + test + text[insert_at:]
          bible_test.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/settings-page.test.tsx apps/web/src/features/bible/bible-page.tsx apps/web/src/features/bible/bible.test.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/settings/settings-page.test.tsx src/features/bible/bible.test.tsx
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/settings-page.test.tsx apps/web/src/features/bible/bible-page.tsx apps/web/src/features/bible/bible.test.tsx
          git commit -m "feat: link Settings to Bible version manager"
          git push origin HEAD:feature/bible-mobile-parity
