name: Localize Playlist Chrome

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Localize playlist chrome
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/i18n/index.ts')
          text = path.read_text()
          inserts = {
            "    noMatchingHymns: 'Tidak ditemukan pujian yang cocok.',\n": """    noMatchingHymns: 'Tidak ditemukan pujian yang cocok.',
              playlistLabel: 'Playlist pujian',
              arrangeHymns: 'Susun urutan pujian',
              songSingular: 'lagu',
              songPlural: 'lagu',
              newPlaylistName: 'Nama playlist baru…',
              newPlaylistNameLabel: 'Nama playlist baru',
              createPlaylist: 'Buat playlist',
              activePlaylist: 'Playlist aktif',
              choosePlaylist: '— pilih playlist —',
              playMode: 'Mode putar',
              loopOff: 'Tanpa ulang',
              loopPlaylist: 'Ulang playlist',
              shuffleAll: 'Acak semua',
              shufflePlaylist: 'Acak playlist',
              alreadyAdded: 'Sudah ada',
              addThisHymn: 'Tambah lagu ini',
              renamePlaylist: 'Ubah nama playlist',
              save: 'Simpan',
              renameActivePlaylist: 'Ubah nama',
              playlistEmpty: 'Playlist masih kosong. Tambahkan lagu dari viewer.',
              manageSong: 'Atur',
              moveUp: 'Naikkan',
              moveDown: 'Turunkan',
              removeFromPlaylist: 'Hapus dari playlist',
              deleteThisPlaylist: 'Hapus playlist ini',
          """,
            "    noMatchingHymns: 'No matching hymns found.',\n": """    noMatchingHymns: 'No matching hymns found.',
              playlistLabel: 'Hymn playlist',
              arrangeHymns: 'Arrange hymn order',
              songSingular: 'hymn',
              songPlural: 'hymns',
              newPlaylistName: 'New playlist name…',
              newPlaylistNameLabel: 'New playlist name',
              createPlaylist: 'Create playlist',
              activePlaylist: 'Active playlist',
              choosePlaylist: '— choose playlist —',
              playMode: 'Playback mode',
              loopOff: 'No repeat',
              loopPlaylist: 'Repeat playlist',
              shuffleAll: 'Shuffle all',
              shufflePlaylist: 'Shuffle playlist',
              alreadyAdded: 'Already added',
              addThisHymn: 'Add this hymn',
              renamePlaylist: 'Rename playlist',
              save: 'Save',
              renameActivePlaylist: 'Rename',
              playlistEmpty: 'This playlist is empty. Add hymns from the viewer.',
              manageSong: 'Manage',
              moveUp: 'Move up',
              moveDown: 'Move down',
              removeFromPlaylist: 'Remove from playlist',
              deleteThisPlaylist: 'Delete this playlist',
          """,
            "    noMatchingHymns: '未找到相符的赞美诗。',\n": """    noMatchingHymns: '未找到相符的赞美诗。',
              playlistLabel: '赞美诗播放列表',
              arrangeHymns: '编排赞美诗顺序',
              songSingular: '首赞美诗',
              songPlural: '首赞美诗',
              newPlaylistName: '新播放列表名称…',
              newPlaylistNameLabel: '新播放列表名称',
              createPlaylist: '创建播放列表',
              activePlaylist: '当前播放列表',
              choosePlaylist: '— 选择播放列表 —',
              playMode: '播放模式',
              loopOff: '不循环',
              loopPlaylist: '循环播放列表',
              shuffleAll: '全部随机',
              shufflePlaylist: '播放列表随机',
              alreadyAdded: '已添加',
              addThisHymn: '添加这首赞美诗',
              renamePlaylist: '重命名播放列表',
              save: '保存',
              renameActivePlaylist: '重命名',
              playlistEmpty: '播放列表为空。请从赞美诗查看器添加。',
              manageSong: '管理',
              moveUp: '上移',
              moveDown: '下移',
              removeFromPlaylist: '从播放列表移除',
              deleteThisPlaylist: '删除此播放列表',
          """,
          }
          for old, new in inserts.items():
              if old not in text:
                  raise SystemExit(f'i18n playlist anchor missing: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > apps/web/src/features/hymnal/playlist-bar.tsx <<'EOF'
          import { useState } from 'react';
          import { Link } from 'react-router-dom';
          import { ArrowDown, ArrowUp, Check, ListPlus, Plus, Repeat, Trash } from '@phosphor-icons/react';
          import {
            addSongToPlaylist,
            createPlaylist,
            cycleLoopMode,
            deletePlaylist,
            moveSong,
            removeSongFromPlaylist,
            renamePlaylist,
            setActivePlaylist,
            songKey,
            type LoopMode,
            type PlaylistState,
            type SongRef,
          } from '@gysapp/core';
          import { useT, type TranslationKey } from '../../i18n';
          import { persistPlaylistState, usePlaylistState } from './playlist-store';
          import './playlist-bar.css';

          const LOOP_KEYS: Record<LoopMode, TranslationKey> = {
            off: 'loopOff',
            playlist: 'loopPlaylist',
            'shuffle-all': 'shuffleAll',
            'shuffle-playlist': 'shufflePlaylist',
          };

          export function PlaylistBar({ song, onAdded }: { song?: SongRef; onAdded?: () => void }) {
            const { t } = useT();
            const state = usePlaylistState();
            const [newName, setNewName] = useState('');
            const [renameValue, setRenameValue] = useState('');
            const [renaming, setRenaming] = useState(false);

            const persist = (next: PlaylistState) => persistPlaylistState(next);
            const active = state.playlists.find((playlist) => playlist.id === state.activeId) ?? null;
            const songAlreadyAdded =
              !!song && !!active?.songs.some((candidate) => songKey(candidate) === songKey(song));
            const loopLabel = t(LOOP_KEYS[state.loopMode]);

            const createNamedPlaylist = () => {
              const trimmed = newName.trim();
              if (!trimmed) return;
              const existing = state.playlists.find(
                (playlist) => playlist.name.trim().toLocaleLowerCase() === trimmed.toLocaleLowerCase(),
              );
              if (existing) {
                persist(setActivePlaylist(state, existing.id));
                setNewName('');
                return;
              }
              const created = createPlaylist(state, trimmed);
              const next = created.playlists.at(-1);
              persist(next ? setActivePlaylist(created, next.id) : created);
              setNewName('');
            };

            const addCurrent = () => {
              if (!song) return;
              if (!active) {
                const created = createPlaylist(state, 'Favorit');
                const favorite =
                  created.playlists.find((playlist) => playlist.name.toLocaleLowerCase() === 'favorit') ??
                  created.playlists.at(-1);
                if (!favorite) return;
                persist(addSongToPlaylist(setActivePlaylist(created, favorite.id), favorite.id, song));
              } else {
                persist(addSongToPlaylist(state, active.id, song));
              }
              onAdded?.();
            };

            const startRename = () => {
              if (!active) return;
              setRenameValue(active.name);
              setRenaming(true);
            };

            const commitRename = () => {
              if (!active) return;
              const trimmed = renameValue.trim();
              if (trimmed) persist(renamePlaylist(state, active.id, trimmed));
              setRenaming(false);
            };

            return (
              <section className="playlist-bar" aria-label={t('playlistLabel')}>
                <div className="playlist-heading">
                  <div>
                    <p className="playlist-eyebrow">Playlist</p>
                    <h2>{t('arrangeHymns')}</h2>
                  </div>
                  {active && (
                    <span className="playlist-count">
                      {active.songs.length} {t(active.songs.length === 1 ? 'songSingular' : 'songPlural')}
                    </span>
                  )}
                </div>

                <div className="playlist-row">
                  <div className="playlist-controls">
                    <div className="playlist-create-row">
                      <input
                        className="faith-search playlist-name-input"
                        placeholder={t('newPlaylistName')}
                        aria-label={t('newPlaylistNameLabel')}
                        value={newName}
                        onChange={(event) => setNewName(event.target.value)}
                        onKeyDown={(event) => {
                          if (event.key === 'Enter') createNamedPlaylist();
                        }}
                      />
                      <button
                        type="button"
                        className="icon-btn"
                        aria-label={t('createPlaylist')}
                        disabled={!newName.trim()}
                        onClick={createNamedPlaylist}
                      >
                        <Plus size={20} aria-hidden="true" />
                      </button>
                    </div>

                    <select
                      className="bible-book-select playlist-select"
                      aria-label={t('activePlaylist')}
                      value={active?.id ?? ''}
                      onChange={(event) => {
                        persist(setActivePlaylist(state, event.target.value || null));
                        setRenaming(false);
                      }}
                    >
                      <option value="">{t('choosePlaylist')}</option>
                      {state.playlists.map((playlist) => (
                        <option key={playlist.id} value={playlist.id}>
                          {playlist.name} ({playlist.songs.length})
                        </option>
                      ))}
                    </select>

                    <button
                      type="button"
                      className={`chip${state.loopMode !== 'off' ? ' chip-active' : ''}`}
                      aria-pressed={state.loopMode !== 'off'}
                      aria-label={`${t('playMode')}: ${loopLabel}`}
                      onClick={() => persist({ ...state, loopMode: cycleLoopMode(state.loopMode) })}
                    >
                      <Repeat size={18} aria-hidden="true" /> {loopLabel}
                    </button>
                  </div>

                  {song && (
                    <button
                      type="button"
                      className="btn-primary playlist-add"
                      disabled={songAlreadyAdded}
                      onClick={addCurrent}
                    >
                      {songAlreadyAdded ? (
                        <>
                          <Check size={20} aria-hidden="true" /> {t('alreadyAdded')}
                        </>
                      ) : (
                        <>
                          <ListPlus size={20} aria-hidden="true" /> {t('addThisHymn')}
                        </>
                      )}
                    </button>
                  )}
                </div>

                {active && (
                  <div className="playlist-editor">
                    <div className="playlist-active-header">
                      {renaming ? (
                        <div className="playlist-rename-row">
                          <input
                            className="faith-search"
                            aria-label={t('renamePlaylist')}
                            value={renameValue}
                            autoFocus
                            onChange={(event) => setRenameValue(event.target.value)}
                            onKeyDown={(event) => {
                              if (event.key === 'Enter') commitRename();
                              if (event.key === 'Escape') setRenaming(false);
                            }}
                          />
                          <button type="button" className="btn-secondary" onClick={commitRename}>
                            {t('save')}
                          </button>
                        </div>
                      ) : (
                        <button type="button" className="btn-text playlist-rename" onClick={startRename}>
                          {t('renameActivePlaylist')} “{active.name}”
                        </button>
                      )}
                    </div>

                    <ol className="playlist-songs">
                      {active.songs.length === 0 && (
                        <li className="playlist-empty">{t('playlistEmpty')}</li>
                      )}
                      {active.songs.map((playlistSong, index) => (
                        <li key={songKey(playlistSong)} className="playlist-song">
                          <span className="playlist-position" aria-hidden="true">
                            {index + 1}
                          </span>
                          <Link to={`/hymnal/${playlistSong.book}/${playlistSong.number}`}>
                            <strong>{playlistSong.number}</strong>
                            <span>{playlistSong.title}</span>
                          </Link>
                          <div className="playlist-song-actions" aria-label={`${t('manageSong')} ${playlistSong.title}`}>
                            <button
                              type="button"
                              className="icon-btn playlist-move"
                              aria-label={`${t('moveUp')} ${playlistSong.title}`}
                              disabled={index === 0}
                              onClick={() => persist(moveSong(state, active.id, index, index - 1))}
                            >
                              <ArrowUp size={18} aria-hidden="true" />
                            </button>
                            <button
                              type="button"
                              className="icon-btn playlist-move"
                              aria-label={`${t('moveDown')} ${playlistSong.title}`}
                              disabled={index === active.songs.length - 1}
                              onClick={() => persist(moveSong(state, active.id, index, index + 1))}
                            >
                              <ArrowDown size={18} aria-hidden="true" />
                            </button>
                            <button
                              type="button"
                              className="icon-btn playlist-remove"
                              aria-label={`${t('removeFromPlaylist')} ${playlistSong.title}`}
                              onClick={() => persist(removeSongFromPlaylist(state, active.id, playlistSong))}
                            >
                              <Trash size={18} aria-hidden="true" />
                            </button>
                          </div>
                        </li>
                      ))}
                    </ol>

                    <div className="playlist-actions">
                      <button
                        type="button"
                        className="btn-text playlist-delete"
                        onClick={() => {
                          persist(deletePlaylist(state, active.id));
                          setRenaming(false);
                        }}
                      >
                        <Trash size={17} aria-hidden="true" /> {t('deleteThisPlaylist')}
                      </button>
                    </div>
                  </div>
                )}
              </section>
            );
          }
          EOF

          pnpm exec prettier --write apps/web/src/i18n/index.ts apps/web/src/features/hymnal/playlist-bar.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test
          pnpm format:check
      - name: Commit localization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/i18n/index.ts apps/web/src/features/hymnal/playlist-bar.tsx
          git commit -m "feat: localize Hymnal playlist chrome"
          git push origin HEAD:feature/bible-mobile-parity
