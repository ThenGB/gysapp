name: Sync Final PR4 Status

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/sync-final-pr4-status.py
      - run: pnpm exec prettier --write docs/implementation-roadmap.md docs/parity-matrix.md
      - run: pnpm format:check
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md docs/parity-matrix.md
          git commit -m "docs: close automated parity work for PR4"
          git push origin HEAD:feature/bible-mobile-parity
