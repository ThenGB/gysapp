name: Sync Release Docs

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync roadmap and parity status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('docs/implementation-roadmap.md')
          text = roadmap.read_text()
          replacements = {
            '- route-level lazy loading; initial main shell sekitar **130 KB gzip**, di bawah budget 250 KB;': '- route-level lazy loading; initial production JavaScript sekitar **134 KiB gzip**, dipagari hard budget 250 KiB;',
            '- accessibility regression: 320–1920, effective 200% browser-zoom reflow, keyboard focus, reduced motion;': '- accessibility regression: 320–1920, effective 200% browser-zoom reflow, keyboard focus, reduced motion, serta automated light/dark WCAG contrast checks;',
            '- iOS Xcode simulator compile gate pada macOS.': '- iOS Xcode simulator compile gate pada macOS;\n- CI Playwright menjalankan artefak production `dist` melalui `vite preview`, dengan lab guard Home LCP <=2.5s dan CLS <=0.1.',
            'Masih untuk P1/release polish:\n\n- final light/dark contrast + real-device accessibility soak.': 'Masih untuk P1/release polish:\n\n- real-device light/dark/system accessibility/WCAG soak. Automated contrast regression sudah aktif dan hijau.',
            '- Settings menampilkan ukuran/cache count dan dapat menghapus media + chord offline tanpa menyentuh Bible/bookmark/history/playlist/notes.': '- Settings menampilkan ukuran/cache count dan dapat menghapus media + chord offline tanpa menyentuh Bible/bookmark/history/playlist/notes;\n- mode teks/chord dipagari narrow-width regression 320px: chord badge di-clamp ke baris, emergency wrapping tersedia, dan font lirik tetap >=16px.',
            'Sisa Hymnal untuk P1:\n\n- optional text/chord autofit bila golden screenshot menunjukkan overflow;\n- real-device long-song/performance soak.': 'Sisa Hymnal untuk P1:\n\n- real-device long-song MIDI/PDF performance soak. Automated narrow-width text/chord fitting sudah selesai tanpa aggressive font shrinking.',
            '### Bible / Settings\n\n- final light/dark contrast audit dan real-device accessibility soak.': '### Bible / Settings\n\n- real-device light/dark/system accessibility soak; automated contrast/reflow/keyboard/reduced-motion gates sudah aktif.',
            '### Hymnal\n\n- optional text autofit algorithm dengan minimum readable size;\n- real-device long-song/performance soak.': '### Hymnal\n\n- real-device long-song MIDI/PDF performance soak; narrow-width text/chord readability sudah dipagari otomatis.',
            '### Literature / Faith / More\n\n- perluas i18n copy;\n- audit external links dengan platform opener yang sama.': '### Literature / Faith / More\n\n- i18n ID/EN/ZH sudah mencakup Home, Faith, Literatur/Panduan, Lainnya, Settings/backup/cache, e-GYS, Kirim Masukan, Catatan, dan daftar Pujian; lanjutkan hanya generic chrome yang masih hard-coded;\n- audit external links dengan platform opener yang sama.',
            '- Playwright Chromium desktop/mobile/accessibility matrix;': '- Playwright Chromium production-preview desktop/mobile/accessibility matrix;',
            '- secret scan;': '- initial JavaScript gzip budget 250 KiB;\n- lab Web Vitals guard Home LCP <=2.5s / CLS <=0.1;\n- secret scan;',
            '- final light/dark/system contrast soak;\n- long-song MIDI performance soak;\n- production Web Vitals;': '- real-device light/dark/system contrast/accessibility soak;\n- real-device long-song MIDI/PDF performance soak;\n- field/RUM Web Vitals (terutama INP dan p75) setelah deployment beta stabil;',
            '- initial shell <250KB gzip — **achieved (~130KB gzip)**;': '- initial JS <250 KiB gzip — **achieved (~134 KiB gzip)**;',
            '1. Poles optional text/chord autofit dan perluas i18n copy yang masih hard-coded.\n2. Jalankan final light/dark contrast + real-device accessibility/MIDI long-song soak.\n3. Ukur production Web Vitals dan jalankan final beta regression.\n4. Jalankan Android production signed upgrade smoke setelah legacy keystore + fingerprint tersedia.\n5. Tambahkan signed iOS distribution setelah provisioning/signing Apple tersedia.': '1. Lanjutkan i18n hanya pada generic chrome Alkitab/Pujian yang masih hard-coded.\n2. Jalankan real-device light/dark/system accessibility dan MIDI/PDF long-song soak.\n3. Kumpulkan field/RUM Web Vitals setelah deployment beta stabil; production-preview lab regression sudah otomatis.\n4. Jalankan Android production signed upgrade smoke setelah legacy keystore + fingerprint tersedia.\n5. Tambahkan signed iOS distribution setelah provisioning/signing Apple tersedia.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'roadmap anchor missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          roadmap.write_text(text)

          parity = Path('docs/parity-matrix.md')
          text = parity.read_text()
          replacements = {
            '| Mode teks + chord              | in-progress | Centered + multi-page extraction; optional text autofit lanjut          |': '| Mode teks + chord              | done        | Centered + multi-page extraction; 320px clamp/wrap regression, font >=16px |',
            '| i18n id/en/zh foundation                | done   | Copy feature masih terus diperluas                      |': '| i18n id/en/zh foundation                | done   | Journey utama + Settings/e-GYS/Notes/Hymnal list sudah localized |',
            '| WCAG 2.2 AA journey utama           | in-progress | Automated reflow/keyboard/motion lolos; final contrast/real-device soak |': '| WCAG 2.2 AA journey utama           | in-progress | Automated reflow/keyboard/motion/contrast lolos; real-device soak tersisa |',
            '| Production web vitals               | todo        | Diukur setelah deployment stabil                                        |': '| Production web vitals               | in-progress | Production-preview LCP/CLS lab gate done; field/RUM INP+p75 tersisa      |',
            '| Initial shell <250KB gzip           | done        | Route-level lazy loading menurunkan main shell ke sekitar 130KB gzip    |': '| Initial shell <250KB gzip           | done        | Production initial JS ~134 KiB gzip + hard CI budget 250 KiB             |',
            '| Playwright desktop/mobile           | done        | 320–1920 matrix + Bible/Hymnal orientation + player/nav + e-GYS         |': '| Playwright desktop/mobile           | done        | Production `dist` preview; 320–1920 + Bible/Hymnal/player/e-GYS          |',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'parity anchor missing: {old[:80]!r}')
              text = text.replace(old, new, 1)
          parity.write_text(text)
          PY
          pnpm exec prettier --write docs/implementation-roadmap.md docs/parity-matrix.md
          pnpm format:check
      - name: Commit documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md docs/parity-matrix.md
          git commit -m "docs: sync automated release gate status"
          git push origin HEAD:feature/bible-mobile-parity
