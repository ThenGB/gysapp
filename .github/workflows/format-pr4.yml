name: Format PR4 Milestone

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format milestone files
        run: >-
          pnpm exec prettier --write
          apps/web/src/App.tsx
          apps/web/src/data/bible/bible-pack-manager.ts
          apps/web/src/features/bible/bible-page.tsx
          apps/web/src/features/bible/bible-reading-store.ts
          apps/web/src/features/home/home-page.css
          apps/web/src/features/home/home-page.tsx
          apps/web/src/features/settings/settings-page.tsx
          apps/web/src/features/settings/settings-store.ts
          apps/web/src/features/settings/settings.css
          apps/web/src/ui/shell.css
          apps/web/src/ui/shell.tsx
          apps/web/src/ui/tokens.css
          packages/core/src/bible/asset-manifest.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/App.tsx \
            apps/web/src/data/bible/bible-pack-manager.ts \
            apps/web/src/features/bible/bible-page.tsx \
            apps/web/src/features/bible/bible-reading-store.ts \
            apps/web/src/features/home/home-page.css \
            apps/web/src/features/home/home-page.tsx \
            apps/web/src/features/settings/settings-page.tsx \
            apps/web/src/features/settings/settings-store.ts \
            apps/web/src/features/settings/settings.css \
            apps/web/src/ui/shell.css \
            apps/web/src/ui/shell.tsx \
            apps/web/src/ui/tokens.css \
            packages/core/src/bible/asset-manifest.ts
          git commit -m "style: format Bible and mobile milestone"
          git push origin HEAD:feature/bible-mobile-parity
