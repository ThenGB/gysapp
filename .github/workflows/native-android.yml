name: native-android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/native/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native-android.yml'

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Android debug APK
        run: >-
          pnpm --filter @gysapp/native tauri android build
          --debug
          --target aarch64
          --apk
          --ci

      - name: Verify Android identity
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find apps/native/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -1)"
          test -n "$APK" && test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "package: name='id.sch.kanaan.egys'" \
            | grep -F "versionCode='134'"
          mkdir -p dist/android-ci
          cp "$APK" dist/android-ci/GYSApp-android-debug-arm64.apk
          sha256sum dist/android-ci/GYSApp-android-debug-arm64.apk > dist/android-ci/SHA256SUMS.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > dist/android-ci/SOURCE_SHA.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gysapp-android-ci-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/android-ci/*
          if-no-files-found: error
          retention-days: 14
