              ('aria-label="Referensi terkait"', "aria-label={t('relatedReferences')}"),
              ('          <strong>Referensi terkait</strong>', "          <strong>{t('relatedReferences')}</strong>"),
              ("<span>{item.kind === 'parallel' ? 'Paralel' : 'Ref'}</span>", "<span>{item.kind === 'parallel' ? t('parallelLabel') : t('referenceLabel')}</span>"),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new, f'VerseContext {old[:40]}')
          context.write_text(text)

          search = Path('apps/web/src/features/bible/bible-search.tsx')
          text = search.read_text()
          text = replace_once(text, "import { getBiblePort } from '../../data/bible/sqlite-bible-port';\n", "import { getBiblePort } from '../../data/bible/sqlite-bible-port';\nimport { useT } from '../../i18n';\n", 'BibleSearch i18n import')
          old_testaments = """const TESTAMENTS = [
            { value: 'all', label: 'Semua' },
            { value: 'ot', label: 'Perjanjian Lama' },
            { value: 'nt', label: 'Perjanjian Baru' },
          ] as const;"""
          new_testaments = """const TESTAMENTS = [
            { value: 'all', labelKey: 'allTestaments' },
            { value: 'ot', labelKey: 'oldTestament' },
            { value: 'nt', labelKey: 'newTestament' },
          ] as const;"""
          text = replace_once(text, old_testaments, new_testaments, 'BibleSearch testament definitions')
          text = replace_once(text, "export function BibleSearchPage() {\n  const [term", "export function BibleSearchPage() {\n  const { t } = useT();\n  const [term", 'BibleSearch useT')
          replacements = [
              ('aria-label="Kembali ke Alkitab"', "aria-label={t('returnToBible')}"),
              ('<h1 className="bible-search-title">Cari Ayat</h1>', "<h1 className=\"bible-search-title\">{t('searchVerseTitle')}</h1>"),
              ('placeholder="Cari kata atau frasaÃ¢â‚¬Â¦"', "placeholder={t('searchWordsPlaceholder')}"),
              ('aria-label="Filter bagian kitab"', "aria-label={t('bibleSectionFilter')}"),
              ('            {t.label}\n', "            {t(t.labelKey)}\n"),
              ('<p className="bible-search-hint">Pencarian di seluruh 1.189 pasal Alkitab Terjemahan Baru.</p>', "<p className=\"bible-search-hint\">{t('bibleSearchScopeHint')}</p>"),
              ('{searching && <p aria-busy="true">Menyiapkan indexÃ¢â‚¬Â¦</p>}', "{searching && <p aria-busy=\"true\">{t('preparingSearchIndex')}</p>}"),
              ('<p>Index Alkitab gagal dimuat.</p>', "<p>{t('bibleIndexUnavailable')}</p>"),
              ('<p className="bible-empty">Tidak ditemukan ayat yang cocok.</p>', "<p className=\"bible-empty\">{t('noMatchingVerses')}</p>"),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new, f'BibleSearch {old[:40]}')
          search.write_text(text)

          test = Path('apps/web/src/i18n/index.test.ts')
          text = test.read_text()
          anchor = "    expect(t('searchHymn', 'zh')).toBe('搜索赞美诗');\n"
          addition = """

              expect(t('manageBibleLibrary', 'id')).toBe('Kelola Alkitab');
              expect(t('manageBibleLibrary', 'en')).toBe('Manage Bible');
              expect(t('manageBibleLibrary', 'zh')).toBe('管理圣经');

              expect(t('searchVerseTitle', 'id')).toBe('Cari Ayat');
              expect(t('searchVerseTitle', 'en')).toBe('Search Verses');
              expect(t('searchVerseTitle', 'zh')).toBe('搜索经文');
          """
          text = replace_once(text, anchor, anchor + addition, 'i18n Bible regression')
          test.write_text(text)
          PY

          pnpm exec prettier --write \
            apps/web/src/i18n/index.ts \
            apps/web/src/i18n/index.test.ts \
            apps/web/src/features/bible/bible-page.tsx \
            apps/web/src/features/bible/bible-search.tsx \
            apps/web/src/features/bible/bible-verse-context.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test
          pnpm format:check
      - name: Commit localization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/i18n/index.ts \
            apps/web/src/i18n/index.test.ts \
            apps/web/src/features/bible/bible-page.tsx \
            apps/web/src/features/bible/bible-search.tsx \
            apps/web/src/features/bible/bible-verse-context.tsx
          git commit -m "feat: localize Bible reader chrome"
          git push origin HEAD:feature/bible-mobile-parity
