              "    chordLazyHint: 'Chords load automatically when the hymn is opened (lazy cache).',\n": """    chordLazyHint: 'Chords load automatically when the hymn is opened (lazy cache).',
              manageBibleLibrary: 'Manage Bible',
              offlineLibrary: 'Offline library',
              bibleVersions: 'Bible versions',
              bibleLibraryHint: 'New files are activated only after SHA-256 verification succeeds. Stopped downloads resume when the server supports it.',
