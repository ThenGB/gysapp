              listen: 'Listen',
              loadingChapter: 'Loading chapter…',
              bookmarked: 'Bookmarked',
              searchVerse: 'Search verses',
              selectBook: 'Choose book',
              selectChapter: 'Choose chapter',
              primaryVersion: 'Primary version',
              readerControls: 'Reader controls',
              twoPanels: 'Two panels',
              secondPanel: 'Panel 2',
              syncVerse: 'Sync verses',
              bibleTextSize: 'Bible text size',
              decreaseBibleText: 'Decrease Bible text size',
              increaseBibleText: 'Increase Bible text size',
              chapterNavigation: 'Chapter navigation',
              previous: 'Previous',
              next: 'Next',
              bibleReading: 'Bible is being read aloud',
              resume: 'Resume',
              pause: 'Pause',
              stopReading: 'Stop reading',
              verseActions: 'Actions for',
              closeVerseActions: 'Close verse actions',
              removeBookmark: 'Remove bookmark',
              bookmark: 'Bookmark',
              read: 'Read',
              copied: 'Copied',
              copy: 'Copy',
              clipboardManual: 'Clipboard is unavailable. Select the verse text and copy it manually.',
              verseNote: 'Note',
              verseNoteBody: 'Verse note content',
              verseNotePlaceholder: 'Write a personal note for this verse…',
              saved: 'Saved',
              updateNote: 'Update note',
              relatedReferences: 'Related references',
              parallelLabel: 'Parallel',
              referenceLabel: 'Ref',
              returnToBible: 'Back to Bible',
              searchVerseTitle: 'Search Verses',
              searchWordsPlaceholder: 'Search for a word or phrase…',
              bibleSectionFilter: 'Book section filter',
              allTestaments: 'All',
              oldTestament: 'Old Testament',
              newTestament: 'New Testament',
              bibleSearchScopeHint: 'Search all 1,189 chapters of the Indonesian Terjemahan Baru (TB).',
              preparingSearchIndex: 'Preparing index…',
              bibleIndexUnavailable: 'The Bible index could not be loaded.',
              noMatchingVerses: 'No matching verses found.',
          """,
              "    chordLazyHint: '打开赞美诗时会自动加载和弦（延迟缓存）。',\n": """    chordLazyHint: '打开赞美诗时会自动加载和弦（延迟缓存）。',
              manageBibleLibrary: '管理圣经',
              offlineLibrary: '离线书库',
