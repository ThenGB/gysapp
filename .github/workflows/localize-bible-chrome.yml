name: Localize Bible Chrome

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Localize Bible chrome
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing anchor for {label}: {old!r}')
              return text.replace(old, new, 1)

          i18n = Path('apps/web/src/i18n/index.ts')
          text = i18n.read_text()
          inserts = {
              "    chordLazyHint: 'Chord dimuat otomatis saat lagu dibuka (lazy cache).',\n": """    chordLazyHint: 'Chord dimuat otomatis saat lagu dibuka (lazy cache).',
              manageBibleLibrary: 'Kelola Alkitab',
              offlineLibrary: 'Perpustakaan offline',
              bibleVersions: 'Versi Alkitab',
              bibleLibraryHint: 'File baru diaktifkan setelah SHA-256 cocok. Unduhan yang dihentikan akan dilanjutkan bila server mendukung resume.',
              checkingVersions: 'Memeriksa versi…',
              versionListUnavailable: 'Daftar versi belum dapat diperbarui.',
              builtInAvailable: 'Tersedia bawaan',
              installed: 'Terpasang',
