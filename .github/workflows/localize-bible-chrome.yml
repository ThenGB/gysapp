              twoPanels: '双栏',
              secondPanel: '第 2 栏',
              syncVerse: '同步经文',
              bibleTextSize: '圣经文字大小',
              decreaseBibleText: '缩小圣经文字',
              increaseBibleText: '放大圣经文字',
              chapterNavigation: '章节导航',
              previous: '上一章',
              next: '下一章',
              bibleReading: '正在朗读圣经',
              resume: '继续',
              pause: '暂停',
              stopReading: '停止朗读',
              verseActions: '经文操作',
              closeVerseActions: '关闭经文操作',
              removeBookmark: '取消标记',
              bookmark: '标记',
              read: '朗读',
              copied: '已复制',
              copy: '复制',
              clipboardManual: '剪贴板不可用。请选择经文文本并手动复制。',
              verseNote: '笔记',
              verseNoteBody: '经文笔记内容',
              verseNotePlaceholder: '为这节经文写下个人笔记…',
              saved: '已保存',
              updateNote: '更新笔记',
              relatedReferences: '相关参考经文',
              parallelLabel: '平行经文',
              referenceLabel: '参考',
              returnToBible: '返回圣经',
              searchVerseTitle: '搜索经文',
              searchWordsPlaceholder: '搜索词语或短语…',
              bibleSectionFilter: '书卷范围筛选',
              allTestaments: '全部',
              oldTestament: '旧约',
              newTestament: '新约',
              bibleSearchScopeHint: '搜索 TB（Terjemahan Baru）全部 1,189 章。',
              preparingSearchIndex: '正在准备索引…',
              bibleIndexUnavailable: '圣经索引加载失败。',
              noMatchingVerses: '未找到匹配的经文。',
          """,
          }
          for old, new in inserts.items():
              if old not in text:
                  raise SystemExit(f'i18n Bible anchor missing: {old!r}')
              text = text.replace(old, new, 1)
          i18n.write_text(text)

          page = Path('apps/web/src/features/bible/bible-page.tsx')
          text = page.read_text()
          text = replace_once(text, "import { BibleVerseContext } from './bible-verse-context';\n", "import { BibleVerseContext } from './bible-verse-context';\nimport { useT } from '../../i18n';\n", 'BiblePage i18n import')
          text = replace_once(text, ") {\n  const task = usePackTask(status.code);", ") {\n  const { t } = useT();\n  const task = usePackTask(status.code);", 'PackCard useT')
          text = replace_once(text, "function BibleLibraryDialog({ onClose }: { onClose: () => void }) {\n  const queryClient", "function BibleLibraryDialog({ onClose }: { onClose: () => void }) {\n  const { t } = useT();\n  const queryClient", 'BibleLibraryDialog useT')
          text = replace_once(text, "}: ReaderPaneProps) {\n  const port", "}: ReaderPaneProps) {\n  const { t } = useT();\n  const port", 'ReaderPane useT')
          text = replace_once(text, "export function BiblePage() {\n  const params", "export function BiblePage() {\n  const { t } = useT();\n  const params", 'BiblePage useT')

          replacements = [
              ("? 'Tersedia bawaan'", "? t('builtInAvailable')"),
              ("? `Terpasang ${status.installed.version}`", "? `${t('installed')} ${status.installed.version}`"),
              (": 'Belum terpasang'", ": t('notInstalled')"),
              ("<small>{formatBytes(status.remote.sizeBytes)} • SHA-256 terverifikasi</small>", "<small>{formatBytes(status.remote.sizeBytes)} • {t('shaVerified')}</small>"),
              ("? `${progress}%${task.resumable ? ' • dapat dilanjutkan' : ''}`", "? `${progress}%${task.resumable ? ` • ${t('resumable')}` : ''}`"),
              ("? 'Memverifikasi…'", "? t('verifying')"),
              (": 'Memasang…'", ": t('installing')"),
              ("              Stop\n", "              {t('stop')}\n"),
              ("<DownloadSimple size={19} aria-hidden=\"true\" /> Unduh", "<DownloadSimple size={19} aria-hidden=\"true\" /> {t('download')}"),
              ("            Perbarui\n", "            {t('updateBiblePack')}\n"),
              ("            Coba lagi\n", "            {t('retry')}\n"),
              ("{status.builtIn ? 'Hapus update' : 'Hapus'}", "{status.builtIn ? t('removeUpdate') : t('remove')}"),
              ('aria-label="Kelola Alkitab"', "aria-label={t('manageBibleLibrary')}"),
              ('<p className="bible-dialog-kicker">Perpustakaan offline</p>', "<p className=\"bible-dialog-kicker\">{t('offlineLibrary')}</p>"),
              ('<h2>Versi Alkitab</h2>', "<h2>{t('bibleVersions')}</h2>"),
              ('aria-label="Tutup"', "aria-label={t('close')}"),
              ("          File baru baru diaktifkan setelah SHA-256 cocok. Unduhan yang dihentikan akan dilanjutkan\n          bila server mendukung resume.\n", "          {t('bibleLibraryHint')}\n"),
              ("{statuses.isLoading && <p>Memeriksa versi…</p>}", "{statuses.isLoading && <p>{t('checkingVersions')}</p>}"),
              ('<p>Daftar versi belum dapat diperbarui.</p>', "<p>{t('versionListUnavailable')}</p>"),
              ("            Coba lagi\n", "            {t('retry')}\n"),
              (": 'Versi belum tersedia.'", ": t('versionUnavailable')"),
              ("{book?.bl ?? 'Alkitab'}", "{book?.bl ?? t('bible')}"),
              ('<SpeakerHigh size={20} aria-hidden="true" /> Dengarkan', "<SpeakerHigh size={20} aria-hidden=\"true\" /> {t('listen')}"),
              ('{chapterQuery.isLoading && <p className="bible-empty">Memuat pasal…</p>}', "{chapterQuery.isLoading && <p className=\"bible-empty\">{t('loadingChapter')}</p>}"),
              ('aria-label="Ditandai"', "aria-label={t('bookmarked')}"),
              ("bookLabel={book?.bl ?? 'Alkitab'}", "bookLabel={book?.bl ?? t('bible')}"),
              ("label: `${book?.bl ?? 'Alkitab'} ${chapterId}:${selected.v}`", "label: `${book?.bl ?? t('bible')} ${chapterId}:${selected.v}`"),
              ('          <span>Alkitab</span>', "          <span>{t('bible')}</span>"),
              ("{book?.bl ?? 'Memuat…'}", "{book?.bl ?? t('loading')}"),
              ('aria-label="Cari ayat"', "aria-label={t('searchVerse')}"),
              ('aria-label="Kelola versi Alkitab"', "aria-label={t('manageBibleVersions')}"),
              ('<span className="visually-hidden">Pilih kitab</span>', "<span className=\"visually-hidden\">{t('selectBook')}</span>"),
              ('<span className="visually-hidden">Pilih pasal</span>', "<span className=\"visually-hidden\">{t('selectChapter')}</span>"),
              ('                Pasal {chapter}\n', "                {t('chapter')} {chapter}\n"),
              ('<span className="visually-hidden">Versi utama</span>', "<span className=\"visually-hidden\">{t('primaryVersion')}</span>"),
              ('aria-label="Kontrol pembaca"', "aria-label={t('readerControls')}"),
              ('<ArrowsOutLineHorizontal size={19} aria-hidden="true" /> Dua panel', "<ArrowsOutLineHorizontal size={19} aria-hidden=\"true\" /> {t('twoPanels')}"),
              ('            <span>Panel 2</span>', "            <span>{t('secondPanel')}</span>"),
              ('            Sinkron ayat\n', "            {t('syncVerse')}\n"),
              ('aria-label="Ukuran teks Alkitab"', "aria-label={t('bibleTextSize')}"),
              ('aria-label="Perkecil teks Alkitab"', "aria-label={t('decreaseBibleText')}"),
              ('aria-label="Perbesar teks Alkitab"', "aria-label={t('increaseBibleText')}"),
              ('aria-label="Navigasi pasal"', "aria-label={t('chapterNavigation')}"),
              ('<CaretLeft size={20} aria-hidden="true" /> Sebelumnya', "<CaretLeft size={20} aria-hidden=\"true\" /> {t('previous')}"),
              ('          Berikutnya <CaretRight size={20} aria-hidden="true" />', "          {t('next')} <CaretRight size={20} aria-hidden=\"true\" />"),
              ('          <span>Alkitab sedang dibacakan</span>', "          <span>{t('bibleReading')}</span>"),
              ("aria-label={tts.paused ? 'Lanjutkan' : 'Jeda'}", "aria-label={tts.paused ? t('resume') : t('pause')}"),
              ('aria-label="Stop pembacaan"', "aria-label={t('stopReading')}"),
          ]
          for old, new in replacements:
              text = replace_once(text, old, new, f'BiblePage {old[:40]}')
          page.write_text(text)

          context = Path('apps/web/src/features/bible/bible-verse-context.tsx')
          text = context.read_text()
          text = replace_once(text, "import { deleteNote, findContextNote, saveContextNote, type AppNote } from '../notes/notes-store';\n", "import { deleteNote, findContextNote, saveContextNote, type AppNote } from '../notes/notes-store';\nimport { useT } from '../../i18n';\n", 'VerseContext i18n import')
          text = replace_once(text, "}: BibleVerseContextProps) {\n  const target", "}: BibleVerseContextProps) {\n  const { t } = useT();\n  const target", 'VerseContext useT')
          replacements = [
              ('aria-label={`Aksi ${target}`}', "aria-label={`${t('verseActions')} ${target}`}"),
              ('aria-label="Tutup aksi ayat"', "aria-label={t('closeVerseActions')}"),
              ("{bookmarked ? 'Hapus tanda' : 'Tandai'}", "{bookmarked ? t('removeBookmark') : t('bookmark')}"),
              ('<SpeakerHigh size={19} aria-hidden="true" /> Baca', "<SpeakerHigh size={19} aria-hidden=\"true\" /> {t('read')}"),
              ("{copyState === 'done' ? 'Tersalin' : 'Salin'}", "{copyState === 'done' ? t('copied') : t('copy')}"),
