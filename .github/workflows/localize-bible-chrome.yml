              updateBiblePack: 'Perbarui',
              removeUpdate: 'Hapus update',
              remove: 'Hapus',
              close: 'Tutup',
              versionUnavailable: 'Versi belum tersedia.',
              listen: 'Dengarkan',
              loadingChapter: 'Memuat pasal…',
              bookmarked: 'Ditandai',
              searchVerse: 'Cari ayat',
              selectBook: 'Pilih kitab',
              selectChapter: 'Pilih pasal',
              primaryVersion: 'Versi utama',
              readerControls: 'Kontrol pembaca',
              twoPanels: 'Dua panel',
              secondPanel: 'Panel 2',
              syncVerse: 'Sinkron ayat',
              bibleTextSize: 'Ukuran teks Alkitab',
              decreaseBibleText: 'Perkecil teks Alkitab',
              increaseBibleText: 'Perbesar teks Alkitab',
              chapterNavigation: 'Navigasi pasal',
              previous: 'Sebelumnya',
              next: 'Berikutnya',
              bibleReading: 'Alkitab sedang dibacakan',
              resume: 'Lanjutkan',
              pause: 'Jeda',
              stopReading: 'Stop pembacaan',
              verseActions: 'Aksi',
              closeVerseActions: 'Tutup aksi ayat',
              removeBookmark: 'Hapus tanda',
              bookmark: 'Tandai',
              read: 'Baca',
              copied: 'Tersalin',
              copy: 'Salin',
              clipboardManual: 'Clipboard tidak tersedia. Pilih teks ayat untuk menyalin secara manual.',
