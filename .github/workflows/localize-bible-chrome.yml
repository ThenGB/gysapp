              bibleLibraryHint: '新文件只有在 SHA-256 校验通过后才会启用。若服务器支持续传，已停止的下载可继续。',
              checkingVersions: '正在检查版本…',
              versionListUnavailable: '暂时无法更新版本列表。',
              builtInAvailable: '内置可用',
              installed: '已安装',
              notInstalled: '未安装',
              shaVerified: 'SHA-256 已验证',
