name: patch-bible-webcrypto-temp

on:
  push:
    branches: [feature/bible-mobile-parity]
    paths:
      - '.github/workflows/patch-bible-webcrypto-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - name: Patch WebCrypto buffers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/data/bible/bible-pack-manager.ts')
          s = p.read_text()
          s = s.replace("    base64Bytes(LEGACY_PACKAGE_KEY_BASE64),\n", "    new Uint8Array(base64Bytes(LEGACY_PACKAGE_KEY_BASE64)).buffer,\n")
          s = s.replace("    { name: 'AES-CTR', counter: iv, length: 128 },\n", "    { name: 'AES-CTR', counter: new Uint8Array(iv).buffer, length: 128 },\n")
          s = s.replace("    ciphertext,\n", "    new Uint8Array(ciphertext).buffer,\n", 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/data/bible/bible-pack-manager.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use owned buffers for Bible WebCrypto'
          git push
