name: Integrate PDF Media Cache

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate persistent PDF bytes without weakening cancellation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/hymnal/song-viewer.tsx')
          text = path.read_text()

          guard_import = "import { LatestRequestGuard } from '../../lib/latest-request';\n"
          cache_import = "import { offlineMediaCache } from '../../platform/offline-media-cache';\n"
          if cache_import not in text:
              if guard_import not in text:
                  raise SystemExit('LatestRequestGuard import anchor not found')
              text = text.replace(guard_import, guard_import + cache_import, 1)

          pdf_effect = text.index('// LatestRequestGuard mencegah PDF lama')
          controller_anchor = "    let committedLoadingTask = false;\n"
          controller_line = "    const mediaAbort = new AbortController();\n"
          if controller_line not in text[pdf_effect:]:
              controller_at = text.index(controller_anchor, pdf_effect) + len(controller_anchor)
              text = text[:controller_at] + controller_line + text[controller_at:]

          old = "          loadingTask = pdfjs.getDocument({ url: resolved.pdfUrl });\n          const loadedDoc = await loadingTask.promise;"
          new = "          const pdfBytes = await offlineMediaCache.getOrFetch(resolved.pdfUrl, 'pdf', {\n            signal: mediaAbort.signal,\n          });\n          if (!isCurrent()) return;\n          loadingTask = pdfjs.getDocument({ data: new Uint8Array(pdfBytes) });\n          const loadedDoc = await loadingTask.promise;"
          if old in text:
              text = text.replace(old, new, 1)
          elif "offlineMediaCache.getOrFetch(resolved.pdfUrl, 'pdf'" not in text:
              raise SystemExit('PDF URL loading block not found')

          pdf_effect = text.index('// LatestRequestGuard mencegah PDF lama')
          load_call = text.index('    void load();', pdf_effect)
          cleanup_anchor = "    return () => {\n      cancelled = true;\n"
          cleanup_at = text.index(cleanup_anchor, load_call)
          if 'mediaAbort.abort();' not in text[cleanup_at:cleanup_at + 160]:
              replacement = "    return () => {\n      cancelled = true;\n      mediaAbort.abort();\n"
              text = text[:cleanup_at] + replacement + text[cleanup_at + len(cleanup_anchor):]

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/hymnal/song-viewer.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/hymnal/song-viewer.test.tsx src/platform/offline-media-cache.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/hymnal/song-viewer.tsx
          git commit -m "feat: persist hymnal PDF media offline"
          git push origin HEAD:feature/bible-mobile-parity
