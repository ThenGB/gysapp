name: format-probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.number == 6
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        shell: bash
        run: |
          pnpm exec prettier --write apps/web/src/data/bible/github-release-download.ts apps/web/src/ui/shell.tsx
          echo '===RESOLVER_BASE64_BEGIN==='
          base64 -w0 apps/web/src/data/bible/github-release-download.ts
          echo
          echo '===RESOLVER_BASE64_END==='
          echo '===SHELL_BASE64_BEGIN==='
          base64 -w0 apps/web/src/ui/shell.tsx
          echo
          echo '===SHELL_BASE64_END==='
