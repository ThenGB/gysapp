name: Centralize Chord Cache

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Move SongViewer to shared chord cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/hymnal/song-viewer.tsx')
          text = path.read_text()
          text = text.replace("import { createHttpManifestFetcher, ChordLazyCache } from '@gysapp/core';\n", '')
          text = text.replace("import { IndexedDbBlobStore } from '../../platform/blob-stores/indexeddb';\n", '')
          anchor = "import { midiEngine } from './midi-engine';\n"
          shared = "import { chordCache } from './chord-cache';\n"
          if shared not in text:
              if anchor not in text:
                  raise SystemExit('MIDI import anchor not found')
              text = text.replace(anchor, shared + anchor, 1)

          start_marker = '// Instalasi baru tidak membawa chord.'
          end_marker = 'function clampZoom(value: unknown): number {'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + end_marker + text[end + len(end_marker):]
          elif 'const chordCache = new ChordLazyCache' in text:
              raise SystemExit('Unexpected chord cache block shape')

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/hymnal/song-viewer.tsx apps/web/src/features/hymnal/chord-cache.ts apps/web/src/features/hymnal/chord-cache.test.ts apps/web/src/features/settings/offline-media-settings.tsx apps/web/src/features/settings/offline-media-settings.test.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/hymnal/chord-cache.test.ts src/features/hymnal/song-viewer.test.tsx src/features/settings/offline-media-settings.test.tsx src/platform/offline-media-cache.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/hymnal/song-viewer.tsx apps/web/src/features/hymnal/chord-cache.ts apps/web/src/features/hymnal/chord-cache.test.ts apps/web/src/features/settings/offline-media-settings.tsx apps/web/src/features/settings/offline-media-settings.test.tsx
          git commit -m "feat: expose shared chord cache cleanup"
          git push origin HEAD:feature/bible-mobile-parity
