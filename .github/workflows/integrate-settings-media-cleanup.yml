name: Integrate Settings Media Cleanup

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate media cleanup and reduced-motion Bible deep link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('apps/web/src/features/settings/settings-page.tsx')
          text = settings.read_text()
          import_anchor = "import { useLocale, useT } from '../../i18n';\n"
          import_line = "import { OfflineMediaSettings } from './offline-media-settings';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Settings import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          data_heading = '        <h2 className="settings-heading">Data</h2>\n'
          media_surface = data_heading + '        <OfflineMediaSettings />\n'
          if '<OfflineMediaSettings />' not in text:
              if data_heading not in text:
                  raise SystemExit('Data heading anchor not found')
              text = text.replace(data_heading, media_surface, 1)
          settings.write_text(text)

          bible = Path('apps/web/src/features/bible/bible-page.tsx')
          text = bible.read_text()
          old = "      node?.scrollIntoView({ block: 'center', behavior: 'smooth' });"
          new = "      const reduceMotion =\n        window.matchMedia('(prefers-reduced-motion: reduce)').matches ||\n        document.documentElement.dataset.reduceMotion === 'true';\n      node?.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });"
          if old in text:
              text = text.replace(old, new, 1)
          elif "behavior: reduceMotion ? 'auto' : 'smooth'" not in text:
              raise SystemExit('Bible scrollIntoView anchor not found')
          bible.write_text(text)

          css = Path('apps/web/src/features/settings/settings.css')
          text = css.read_text()
          styles = '''\n.settings-row-stack {\n  align-items: flex-start;\n  flex-wrap: wrap;\n  margin-top: var(--space-3);\n}\n\n.settings-row-main {\n  display: grid;\n  flex: 1 1 360px;\n  min-width: 0;\n  gap: 4px;\n}\n\n.settings-row-main > span,\n.settings-row-main > small {\n  color: var(--text-tertiary);\n}\n\n.settings-row-main > small {\n  font-size: var(--text-xs);\n}\n\n.settings-danger-action {\n  color: var(--color-error);\n}\n\n.settings-danger-action:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n}\n\n.settings-action-status {\n  flex-basis: 100%;\n  color: var(--text-secondary);\n  font-size: var(--text-sm);\n}\n'''
          if '.settings-row-stack {' not in text:
              marker = '\n.settings-data-actions {'
              at = text.index(marker)
              text = text[:at] + styles + text[at:]
          css.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/offline-media-settings.tsx apps/web/src/features/settings/offline-media-settings.test.tsx apps/web/src/features/settings/settings.css apps/web/src/features/bible/bible-page.tsx
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/settings/offline-media-settings.test.tsx src/features/bible/bible.test.tsx src/features/bible/bible-verse-context.test.tsx src/platform/offline-media-cache.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/settings/settings-page.tsx apps/web/src/features/settings/offline-media-settings.tsx apps/web/src/features/settings/offline-media-settings.test.tsx apps/web/src/features/settings/settings.css apps/web/src/features/bible/bible-page.tsx
          git commit -m "feat: expose safe offline media cleanup in settings"
          git push origin HEAD:feature/bible-mobile-parity
