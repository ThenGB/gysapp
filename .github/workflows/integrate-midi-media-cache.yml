name: Integrate MIDI Media Cache

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate persistent soundfont and MIDI bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/hymnal/midi-engine.ts')
          text = path.read_text()

          old_import = "import { LatestRequestGuard } from '../../lib/latest-request';\n"
          new_import = old_import + "import { offlineMediaCache } from '../../platform/offline-media-cache';\n"
          if "from '../../platform/offline-media-cache'" not in text:
              if old_import not in text:
                  raise SystemExit('LatestRequestGuard import anchor not found')
              text = text.replace(old_import, new_import, 1)

          if "offlineMediaCache.getOrFetch(this.soundfontUrl, 'soundfont')" not in text:
              method = text.index('  private loadSoundFont(): Promise<void> {')
              start = text.index('    this.sfLoading = (async () => {', method)
              end_anchor = '    })().catch((err) => {'
              end = text.index(end_anchor, start) + len(end_anchor)
              text = (
                  text[:start]
                  + "    this.sfLoading = (async () => {\n"
                  + "      const bytes = await offlineMediaCache.getOrFetch(this.soundfontUrl, 'soundfont');\n"
                  + "      const buffer = new Uint8Array(bytes).buffer;\n"
                  + "      await this.request('loadSoundFont', { url: this.soundfontUrl, buffer }, 60_000, [buffer]);\n"
                  + end_anchor
                  + text[end:]
              )

          if "offlineMediaCache.getOrFetch(options.url, 'midi')" not in text:
              start = text.index('        const raw = await fetch(options.url)')
              end = text.index('\n        if (!isCurrent())', start)
              text = (
                  text[:start]
                  + "        const raw = await offlineMediaCache.getOrFetch(options.url, 'midi');"
                  + text[end:]
              )

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/hymnal/midi-engine.ts apps/web/src/platform/offline-media-cache.ts apps/web/src/platform/offline-media-cache.test.ts
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/hymnal/midi-engine.test.ts src/platform/offline-media-cache.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/hymnal/midi-engine.ts apps/web/src/platform/offline-media-cache.ts apps/web/src/platform/offline-media-cache.test.ts
          git commit -m "feat: persist soundfont and MIDI media offline"
          git push origin HEAD:feature/bible-mobile-parity
