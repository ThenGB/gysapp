name: Integrate MIDI Media Cache

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate persistent soundfont and MIDI bytes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/hymnal/midi-engine.ts')
          text = path.read_text()

          old_import = "import { LatestRequestGuard } from '../../lib/latest-request';\n"
          new_import = old_import + "import { offlineMediaCache } from '../../platform/offline-media-cache';\n"
          if "offlineMediaCache" not in text:
              if old_import not in text:
                  raise SystemExit('LatestRequestGuard import anchor not found')
              text = text.replace(old_import, new_import, 1)

          old_soundfont = '''    this.sfLoading = (async () => {
              const res = await fetch(this.soundfontUrl);
              if (!res.ok) throw new Error(`soundfont fetch failed: ${res.status}`);
              const buffer = await res.arrayBuffer();
              await this.request('loadSoundFont', { url: this.soundfontUrl, buffer }, 60_000, [buffer]);
            })().catch((err) => {'''
          new_soundfont = '''    this.sfLoading = (async () => {
              const bytes = await offlineMediaCache.getOrFetch(this.soundfontUrl, 'soundfont');
              const buffer = new Uint8Array(bytes).buffer;
              await this.request('loadSoundFont', { url: this.soundfontUrl, buffer }, 60_000, [buffer]);
            })().catch((err) => {'''
          if old_soundfont in text:
              text = text.replace(old_soundfont, new_soundfont, 1)
          elif "offlineMediaCache.getOrFetch(this.soundfontUrl, 'soundfont')" not in text:
              raise SystemExit('Soundfont fetch block not found')

          old_midi = '''        const raw = await fetch(options.url).then(async (r) => {
                  if (!r.ok) throw new Error(`midi fetch failed: ${r.status}`);
                  return new Uint8Array(await r.arrayBuffer());
                });'''
          new_midi = "        const raw = await offlineMediaCache.getOrFetch(options.url, 'midi');"
          if old_midi in text:
              text = text.replace(old_midi, new_midi, 1)
          elif "offlineMediaCache.getOrFetch(options.url, 'midi')" not in text:
              raise SystemExit('MIDI fetch block not found')

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/features/hymnal/midi-engine.ts apps/web/src/platform/offline-media-cache.ts apps/web/src/platform/offline-media-cache.test.ts
          pnpm --filter @gysapp/web typecheck
          pnpm --filter @gysapp/web test -- src/features/hymnal/midi-engine.test.ts src/platform/offline-media-cache.test.ts
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/hymnal/midi-engine.ts apps/web/src/platform/offline-media-cache.ts apps/web/src/platform/offline-media-cache.test.ts
          git commit -m "feat: persist soundfont and MIDI media offline"
          git push origin HEAD:feature/bible-mobile-parity
