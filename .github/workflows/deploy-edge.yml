name: deploy-content-gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/edge/**'
      - 'packages/**'
      - '.github/workflows/deploy-edge.yml'

permissions:
  contents: read

concurrency:
  group: gysapp-content-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test content gateway
        run: pnpm --filter @gysapp/edge test

      - name: Detect Cloudflare deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Content gateway deploy skipped: add repository secret CLOUDFLARE_API_TOKEN to enable Cloudflare deployment."
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Content gateway deploy skipped: add repository secret CLOUDFLARE_ACCOUNT_ID to enable Cloudflare deployment."
          fi

      - name: Deploy optional Cloudflare content gateway
        if: steps.cloudflare.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          wranglerVersion: '4'
          workingDirectory: apps/edge
          command: deploy
