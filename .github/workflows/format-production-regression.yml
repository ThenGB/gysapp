name: Format Production Regression

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format production regression files
        run: |
          pnpm exec prettier --write playwright.production.config.ts scripts/check-web-bundle-budget.mjs tests/e2e/web-vitals.spec.ts
          pnpm format:check
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright.production.config.ts scripts/check-web-bundle-budget.mjs tests/e2e/web-vitals.spec.ts
          git commit -m "style: format production regression gates"
          git push origin HEAD:feature/bible-mobile-parity
