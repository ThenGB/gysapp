          }

          .switch:disabled,
          .settings-reminder-day input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
          }
          """
          text = replace_once(text, anchor, anchor + styles, 'reminder styles')
          css.write_text(text)

          i18n_test = Path('apps/web/src/i18n/index.test.ts')
