name: Implement Native Reminders

on:
  push:
    branches:
      - feature/bible-mobile-parity

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bible-mobile-parity
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Implement native reminder parity
        shell: bash
        run: |
          cat > apps/web/src/lib/reminder-schedule.ts <<'EOF'
          export const ISO_WEEKDAYS = [1, 2, 3, 4, 5, 6, 7] as const;
          export type IsoWeekday = (typeof ISO_WEEKDAYS)[number];
          export type BibleReminderSchedule = Partial<Record<IsoWeekday, string>>;

          export function isIsoWeekday(value: number): value is IsoWeekday {
            return ISO_WEEKDAYS.includes(value as IsoWeekday);
          }

          export function isReminderTime(value: unknown): value is string {
            return typeof value === 'string' && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
          }

          export function normalizeBibleReminderSchedule(value: unknown): BibleReminderSchedule {
            if (!value || typeof value !== 'object') return {};
            const normalized: BibleReminderSchedule = {};
            for (const [rawWeekday, rawTime] of Object.entries(value)) {
              const weekday = Number(rawWeekday);
              if (isIsoWeekday(weekday) && isReminderTime(rawTime)) {
                normalized[weekday] = rawTime;
              }
            }
            return normalized;
          }

          export function splitReminderTime(time: string): { hour: number; minute: number } {
            if (!isReminderTime(time)) throw new Error(`Invalid reminder time: ${time}`);
            const [hour, minute] = time.split(':').map(Number);
            return { hour: hour ?? 0, minute: minute ?? 0 };
          }

          /** ISO weekday uses Monday=1..Sunday=7; Tauri notification uses Sunday=1..Saturday=7. */
          export function isoWeekdayToTauri(weekday: IsoWeekday): number {
            return weekday === 7 ? 1 : weekday + 1;
          }
          EOF

          cat > apps/web/src/platform/scheduled-notifications.ts <<'EOF'
          import {
            ISO_WEEKDAYS,
            isoWeekdayToTauri,
            splitReminderTime,
            type BibleReminderSchedule,
          } from '../lib/reminder-schedule';

          export const SABAT_NOTIFICATION_ID = 31111;
          const BIBLE_NOTIFICATION_BASE_ID = 321000;
          export const GYS_REMINDER_NOTIFICATION_IDS = [
            SABAT_NOTIFICATION_ID,
            ...ISO_WEEKDAYS.map((weekday) => BIBLE_NOTIFICATION_BASE_ID + weekday),
          ];

          export interface ReminderNotificationCopy {
            sabatTitle: string;
            sabatBody: string;
            bibleTitle: string;
            bibleBody: string;
          }

          export interface ReminderSettingsInput {
            sabatReminder: boolean;
            bibleReminders: BibleReminderSchedule;
          }

          export type ReminderApplyStatus =
            | 'scheduled'
            | 'disabled'
            | 'unsupported'
            | 'permission-denied';

          type NotificationSchedule = unknown;
          type NativeNotificationApi = {
            Schedule?: {
              interval: (
                interval: {
                  weekday?: number;
                  hour?: number;
                  minute?: number;
                  second?: number;
                },
                allowWhileIdle?: boolean,
              ) => NotificationSchedule;
            };
            isPermissionGranted?: () => Promise<boolean>;
            requestPermission?: () => Promise<NotificationPermission>;
            sendNotification?: (options: {
              id: number;
              title: string;
              body: string;
              schedule: NotificationSchedule;
            }) => void;
            cancel?: (ids: number[]) => Promise<void>;
          };

          type TauriNotificationWindow = Window & {
            __TAURI__?: { notification?: NativeNotificationApi };
          };

          function notificationApi(): Required<NativeNotificationApi> | null {
            if (typeof window === 'undefined') return null;
            const api = (window as TauriNotificationWindow).__TAURI__?.notification;
            if (
              !api?.Schedule?.interval ||
              !api.isPermissionGranted ||
              !api.requestPermission ||
              !api.sendNotification ||
              !api.cancel
            ) {
              return null;
            }
            return api as Required<NativeNotificationApi>;
          }

          export function isNativeReminderAvailable(): boolean {
            return notificationApi() !== null;
          }

          async function ensurePermission(
            api: Required<NativeNotificationApi>,
            requestPermission: boolean,
          ): Promise<boolean> {
            if (await api.isPermissionGranted()) return true;
            if (!requestPermission) return false;
            return (await api.requestPermission()) === 'granted';
          }

          function hasBibleReminders(schedule: BibleReminderSchedule): boolean {
            return ISO_WEEKDAYS.some((weekday) => Boolean(schedule[weekday]));
          }

          export async function applyNativeReminderSettings(
            settings: ReminderSettingsInput,
            copy: ReminderNotificationCopy,
            requestPermission = true,
          ): Promise<ReminderApplyStatus> {
            const api = notificationApi();
            if (!api) return 'unsupported';

            const hasAny = settings.sabatReminder || hasBibleReminders(settings.bibleReminders);
            if (hasAny && !(await ensurePermission(api, requestPermission))) {
              return 'permission-denied';
            }

            await api.cancel(GYS_REMINDER_NOTIFICATION_IDS);
            if (!hasAny) return 'disabled';

            try {
              if (settings.sabatReminder) {
                api.sendNotification({
                  id: SABAT_NOTIFICATION_ID,
                  title: copy.sabatTitle,
                  body: copy.sabatBody,
                  schedule: api.Schedule.interval(
                    { weekday: 6, hour: 17, minute: 0, second: 0 },
                    true,
                  ),
                });
              }

              for (const weekday of ISO_WEEKDAYS) {
                const time = settings.bibleReminders[weekday];
                if (!time) continue;
                const { hour, minute } = splitReminderTime(time);
                api.sendNotification({
                  id: BIBLE_NOTIFICATION_BASE_ID + weekday,
                  title: copy.bibleTitle,
                  body: copy.bibleBody,
                  schedule: api.Schedule.interval(
                    {
                      weekday: isoWeekdayToTauri(weekday),
                      hour,
                      minute,
                      second: 0,
                    },
                    true,
                  ),
                });
              }
            } catch (error) {
              await api.cancel(GYS_REMINDER_NOTIFICATION_IDS).catch(() => undefined);
              throw error;
            }

            return 'scheduled';
          }

          export async function cancelAllGysReminders(): Promise<void> {
            const api = notificationApi();
            if (!api) return;
            await api.cancel(GYS_REMINDER_NOTIFICATION_IDS);
          }
          EOF

          cat > apps/web/src/platform/scheduled-notifications.test.ts <<'EOF'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import {
            GYS_REMINDER_NOTIFICATION_IDS,
            SABAT_NOTIFICATION_ID,
            applyNativeReminderSettings,
            cancelAllGysReminders,
            isNativeReminderAvailable,
          } from './scheduled-notifications';

          type TestWindow = Window & { __TAURI__?: unknown };

          function installApi(permission = true) {
            const interval = vi.fn((value, allowWhileIdle = false) => ({
              at: undefined,
              interval: { interval: value, allowWhileIdle },
              every: undefined,
            }));
            const api = {
              Schedule: { interval },
              isPermissionGranted: vi.fn().mockResolvedValue(permission),
              requestPermission: vi.fn().mockResolvedValue('granted'),
              sendNotification: vi.fn(),
              cancel: vi.fn().mockResolvedValue(undefined),
            };
            Object.defineProperty(window, '__TAURI__', {
              configurable: true,
              writable: true,
              value: { notification: api },
            });
            return api;
          }

          const copy = {
            sabatTitle: 'Sabbath',
            sabatBody: 'Prepare',
            bibleTitle: 'Bible',
            bibleBody: 'Read',
          };

          afterEach(() => {
            delete (window as TestWindow).__TAURI__;
            vi.restoreAllMocks();
          });

          describe('scheduled notifications adapter', () => {
            it('reports unsupported outside Tauri', () => {
              expect(isNativeReminderAvailable()).toBe(false);
            });

            it('schedules Friday Sabbath and maps ISO Monday/Sunday to Tauri weekdays', async () => {
              const api = installApi();
              const status = await applyNativeReminderSettings(
                {
                  sabatReminder: true,
                  bibleReminders: { 1: '07:15', 7: '20:30' },
                },
                copy,
              );

              expect(status).toBe('scheduled');
              expect(api.cancel).toHaveBeenCalledWith(GYS_REMINDER_NOTIFICATION_IDS);
              expect(api.sendNotification).toHaveBeenCalledTimes(3);
              expect(api.sendNotification).toHaveBeenCalledWith(
                expect.objectContaining({
                  id: SABAT_NOTIFICATION_ID,
                  schedule: expect.objectContaining({
                    interval: expect.objectContaining({
                      interval: expect.objectContaining({ weekday: 6, hour: 17, minute: 0 }),
                    }),
                  }),
                }),
              );
              expect(api.sendNotification).toHaveBeenCalledWith(
                expect.objectContaining({
                  id: 321001,
                  schedule: expect.objectContaining({
                    interval: expect.objectContaining({
                      interval: expect.objectContaining({ weekday: 2, hour: 7, minute: 15 }),
                    }),
                  }),
                }),
              );
              expect(api.sendNotification).toHaveBeenCalledWith(
                expect.objectContaining({
                  id: 321007,
                  schedule: expect.objectContaining({
                    interval: expect.objectContaining({ weekday: 1, hour: 20, minute: 30 }),
                  }),
                }),
              );
            });

            it('requests permission before creating active schedules', async () => {
              const api = installApi(false);
              await expect(
                applyNativeReminderSettings(
                  { sabatReminder: true, bibleReminders: {} },
                  copy,
                  true,
                ),
              ).resolves.toBe('scheduled');
              expect(api.requestPermission).toHaveBeenCalledOnce();
            });

            it('does not replace existing schedules when permission is denied', async () => {
              const api = installApi(false);
              api.requestPermission.mockResolvedValue('denied');
              await expect(
                applyNativeReminderSettings(
                  { sabatReminder: true, bibleReminders: {} },
                  copy,
                  true,
                ),
              ).resolves.toBe('permission-denied');
              expect(api.cancel).not.toHaveBeenCalled();
              expect(api.sendNotification).not.toHaveBeenCalled();
            });

            it('can cancel all GYSApp-owned reminder ids without requesting permission', async () => {
              const api = installApi(false);
              await cancelAllGysReminders();
              expect(api.cancel).toHaveBeenCalledWith(GYS_REMINDER_NOTIFICATION_IDS);
              expect(api.requestPermission).not.toHaveBeenCalled();
            });
          });
          EOF

