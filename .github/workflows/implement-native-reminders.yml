          store_test = Path('apps/web/src/features/settings/settings-store.test.ts')
          store_test.write_text("""import { beforeEach, describe, expect, it } from 'vitest';
          import { loadSettings, updateSettings } from './settings-store';

          describe('settings reminder persistence', () => {
