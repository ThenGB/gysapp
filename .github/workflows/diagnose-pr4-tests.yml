name: Diagnose PR4 Tests

on:
  push:
    branches:
      - feature/bible-mobile-parity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm -r test 2>&1 | tee test-output.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4-test-output
          path: test-output.txt
      - if: steps.tests.outcome == 'failure'
        run: exit 1
